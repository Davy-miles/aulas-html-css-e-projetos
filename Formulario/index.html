<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body style="margin: 0;display: flex;">
    <div>
        <form action="" method="">
        <input type="text" placeholder="Nome completo">
        <br>
        <input type="date" placeholder="nascimento">
        <br>
        <input type="tel" placeholder="(xx) x-xxxx-xxxx">
        <br>
        <input type="email" placeholder="email">
        <br>
        <input type="text" placeholder="Endereço">
        <input type="number" placeholder="Cep">
        <br>
        <input type="number" placeholder="Numero">
        <input type="text" placeholder="Bairro">
        <br>
        <input type="text" placeholder="Cidade">
        <br>
        <datalist id="Unidades-federais">
            <option></option>
            <option>SP</option>
            <option>RJ</option>
            <option>CE</option>
        </datalist>
        <label for="UF">UF</label>
        <input list="Unidades-federais" id="UF" placeholder="Unidades federativas">
        <br>
        <input type="button" placeholder="Enviar formulario">
    </form>
    </div>
</body>
</html>
